services:
- type: web
  name: todo-backend
  runtime: python
  repo: .
  region: oregon  # You can change this to your preferred region
  branch: main
  buildCommand: pip install -r backend/requirements.txt
  startCommand: cd backend && python start_server.py
  envVars:
  - key: DATABASE_URL
    sync: false  # You'll set this manually in the Render dashboard
  - key: JWT_SECRET_KEY
    value: VKNtP9E9EPeHgfKgECJWj9QKyTLdDo4cOnDTNFFtWT4
  - key: JWT_REFRESH_SECRET_KEY
    value: 7McGNa-KOgPMt4r5Wclnp-WXSewymj2jszVG-m9zZFc
  - key: BETTER_AUTH_SECRET
    value: g3r1fTamim6swGxQelGHU090dWG_v3S4Fh8KN_VjK88
  - key: ENVIRONMENT
    value: production
  - key: PORT
    value: 10000
  - key: DEBUG
    value: "False"
  - key: CORS_ALLOWED_ORIGINS
    value: "https://todo-backend.onrender.com"